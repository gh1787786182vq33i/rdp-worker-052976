name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        env:
          RDP_PASS: ${{ secrets.RDP_PASS }}
        run: |
          echo "::add-mask::$env:RDP_PASS"
          $securePass = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

      - name: Restore data from backup repo
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          $ErrorActionPreference = 'Continue'
          $owner = "$env:GITHUB_REPOSITORY_OWNER"
          $dst = "C:\persist"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          git clone --depth 1 "https://x-access-token:$env:BACKUP_TOKEN@github.com/$owner/rdp-data.git" "$dst\repo" 2>&1 | Write-Host
          if (Test-Path "$dst\repo\payload") {
            Copy-Item "$dst\repo\payload\*" "$dst\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "RESTORED: payload -> C:\persist"
          } else {
            Write-Host "RESTORE: no payload yet (first boot)"
          }

      - name: Install AnyDesk
        continue-on-error: false
        env:
          ANYDESK_PASS: ${{ secrets.ANYDESK_PASS }}
        run: |
          $ErrorActionPreference = 'Continue'
          echo "::add-mask::$env:ANYDESK_PASS"
          $adUrl = "https://download.anydesk.com/AnyDesk.exe"
          $adPath = "$env:TEMP\AnyDesk.exe"
          Invoke-WebRequest -Uri $adUrl -OutFile $adPath -UseBasicParsing
          Start-Process -FilePath $adPath -ArgumentList "--install","C:\AnyDesk","--start-with-win","--silent" -Wait
          Start-Sleep -Seconds 8
          # Restore AnyDesk identity (stable ID) if backed up, BEFORE first service start
          $persist = "C:\persist"
          if (Test-Path "$persist\anydesk_conf\system.conf") {
            Stop-Service AnyDesk -ErrorAction SilentlyContinue
            Copy-Item "$persist\anydesk_conf\*" "$env:ProgramData\AnyDesk\" -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "AnyDesk identity restored (stable ID)"
          }
          # Enable unattended access so the password works without interactive approval
          $adConf = "$env:ProgramData\AnyDesk\system.conf"
          if (Test-Path $adConf) {
            $cfg = Get-Content $adConf | Where-Object { $_ -notmatch '^ad\.security\.enable_unattended_access=' }
            $cfg += 'ad.security.enable_unattended_access=1'
            Set-Content -Path $adConf -Value $cfg
          }
          Stop-Service AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          Start-Service AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 4
          # Set unattended password via stdin (no trailing space/newline beyond LF)
          $env:ANYDESK_PASS | & "C:\AnyDesk\AnyDesk.exe" --set-password 2>&1 | Write-Host
          Start-Sleep -Seconds 3
          # Retry with service fully stopped (documented requirement for --set-password)
          $hashChk = Select-String -Path "$env:ProgramData\AnyDesk\system.conf","$env:ProgramData\AnyDesk\service.conf" -Pattern '^ad\.anynet\.hash=' -ErrorAction SilentlyContinue
          if (-not $hashChk) {
            Write-Host "hash missing, retrying with service stopped"
            Stop-Service AnyDesk -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 4
            "set-password via cmd pipe (no pwsh CRLF)"
            cmd /c "echo %ANYDESK_PASS%|""C:\AnyDesk\AnyDesk.exe"" --set-password" 2>&1 | Write-Host
            Start-Sleep -Seconds 4
          }
          # Verify password hash + unattended flag actually landed
          $hashHit = Select-String -Path "$env:ProgramData\AnyDesk\system.conf","$env:ProgramData\AnyDesk\service.conf" -Pattern '^ad\.anynet\.hash=' -ErrorAction SilentlyContinue
          if ($hashHit) { Write-Host "ANYDESK_PW_HASH_SET=yes" } else { Write-Host "ANYDESK_PW_HASH_MISSING" }
          $unatt = Select-String -Path $adConf -Pattern 'enable_unattended_access=1' -Quiet -ErrorAction SilentlyContinue
          Write-Host "ANYDESK_UNATTENDED=$unatt"
          Stop-Service AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-Service AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5
          $adId = ""
          for ($i=0; $i -lt 12 -and -not $adId; $i++) {
            Start-Sleep -Seconds 5
            foreach ($cf in @("$env:ProgramData\AnyDesk\system.conf", "$env:ProgramData\AnyDesk\service.conf", "C:\AnyDesk\system.conf")) {
              if (Test-Path $cf) {
                $line = (Get-Content $cf | Select-String -Pattern '^ad\.anynet\.id=')
                if ($line) { $adId = ($line -split '=')[-1].Trim(); break }
              }
            }
            if (-not $adId) { try { $out = (& "C:\AnyDesk\AnyDesk.exe" --get-id 2>$null | Out-String).Trim(); if ($out -match '^\d+$') { $adId = $out } } catch {} }
            if ($adId) { break }
          }
          Write-Host "ANYDESK_ID_RESOLVED=$adId"
          echo "ANYDESK_ID=$adId" >> $env:GITHUB_ENV
          exit 0

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Connect Tailscale
        run: |
          & "$env:ProgramFiles\Tailscale\tailscale.exe" up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-$env:GITHUB_RUN_ID
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
              $tsIP = & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          if (-not $tsIP) { Write-Error "No Tailscale IP"; exit 1 }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Open AnyDesk firewall
        run: |
          netsh advfirewall firewall add rule name="AnyDesk" dir=in action=allow program="C:\AnyDesk\AnyDesk.exe" enable=yes
          Get-Service AnyDesk | Set-Service -StartupType Automatic
          Start-Service AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3

      - name: Install scheduled backup task (every 10 min)
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          echo "::add-mask::$env:BACKUP_TOKEN"
          New-Item -ItemType Directory -Force -Path "C:\persist" | Out-Null
          # token for SYSTEM-readable use by REST-based backup
          $env:BACKUP_TOKEN | Out-File -FilePath "C:\persist\.bktoken" -Encoding ASCII -NoNewline
          $owner = "$env:GITHUB_REPOSITORY_OWNER"
          $lines = @(
            '$ErrorActionPreference = ''SilentlyContinue''',
            '$dst = ''C:\persist''',
            '$token = (Get-Content ($dst + ''\.bktoken'') -Raw).Trim()',
            '$hdr = @{ Authorization = ''Bearer '' + $token; Accept = ''application/vnd.github+json''; ''User-Agent'' = ''rdp-backup'' }',
            '$owner = ''${{ github.repository_owner }}''',
            '$repo = ''rdp-data''',
            '$api = ''https://api.github.com''',
            '$log = $dst + ''\backup_log.txt''',
            '(''=== run '' + (Get-Date -Format ''yyyy-MM-dd HH:mm:ss'')) | Out-File $log -Append',
            '(''token_len='' + $token.Length + '' tokfile='' + (Test-Path ($dst + ''\.bktoken''))) | Out-File $log -Append',
            '$files = @{}',
            '$files[''payload/anydesk_conf/system.conf''] = $env:ProgramData + ''\AnyDesk\system.conf''',
            'Get-ChildItem ($env:USERPROFILE + ''\Desktop'') -File -ErrorAction SilentlyContinue | ForEach-Object { $files[''payload/desktop/'' + $_.Name] = $_.FullName }',
            'Get-ChildItem ($env:USERPROFILE + ''\Documents'') -File -ErrorAction SilentlyContinue | ForEach-Object { $files[''payload/documents/'' + $_.Name] = $_.FullName }',
            'foreach ($k in $files.Keys) {',
            '  $src = $files[$k]',
            '  if (-not (Test-Path $src)) { continue }',
            '  $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($src))',
            '  $url = $api + ''/repos/'' + $owner + ''/'' + $repo + ''/contents/'' + $k',
            '  $sha = $null',
            '  $gs = $null',
            '  try { $get = Invoke-RestMethod -Uri $url -Headers $hdr -Method GET; $sha = $get.sha; (''GETHIT '' + $k) | Out-File $log -Append } catch { try { $gs = $_.Exception.Response.StatusCode.value__ } catch {}; if ($gs -ne 404) { throw }; (''GETMISS '' + $k) | Out-File $log -Append }',
            '  $body = @{ message = (''auto backup '' + (Get-Date -Format ''HH:mm'') + '' '' + $k); content = $b64; branch = ''main'' } | ConvertTo-Json',
            '  if ($sha) { $body = @{ message = (''auto backup '' + (Get-Date -Format ''HH:mm'') + '' '' + $k); content = $b64; branch = ''main''; sha = $sha } | ConvertTo-Json }',
            '  try { Invoke-RestMethod -Uri $url -Headers $hdr -Method PUT -Body $body -ContentType ''application/json'' | Out-Null; (''OK '' + $k) | Out-File $log -Append } catch { (''FAIL '' + $k + '' '' + $_.Exception.Message + '' URL='' + $url + '' BODY='' + $_.ErrorDetails.Message) | Out-File $log -Append }',
            '}',
            '(''done '' + (Get-Date -Format ''HH:mm:ss'')) | Out-File $log -Append'
          )
          $script = $lines -join "`r`n"
          $script | Out-File -FilePath "C:\persist\backup_task.ps1" -Encoding ASCII
          # launch detached backup loop as child of runner agent (Task Scheduler is broken on GH runners)
          Start-Process -FilePath "C:\Program Files\PowerShell\7\pwsh.exe" -ArgumentList "-NoProfile","-ExecutionPolicy","Bypass","-Command","while (`$true) { try { & 'C:\persist\backup_task.ps1' } catch { ('CAUGHT ' + `$_.Exception.Message) | Out-File 'C:\persist\backup_log.txt' -Append }; Start-Sleep -Seconds 600 }" -WindowStyle Hidden
          Write-Host "Backup loop launched (detached pwsh, 10-min cycle)"
          Start-Sleep -Seconds 45
          Write-Host "=== POST-FIRE LOG CHECK (T+45s) ==="
          if (Test-Path "C:\persist\backup_log.txt") { Get-Content "C:\persist\backup_log.txt" | Write-Host }
          else { Write-Host "backup_log.txt MISSING at T+45s" }

      - name: Report Access
        run: |
          Write-Host "RDP_IP=$env:TAILSCALE_IP"
          Write-Host "RDP_USER=RDP"
          Write-Host "ANYDESK_ID=$env:ANYDESK_ID"

      - name: Keep Alive
        run: |
          while ($true) {
            $svc = Get-Service AnyDesk -ErrorAction SilentlyContinue
            if ($svc -and $svc.Status -ne 'Running') { Start-Service AnyDesk -ErrorAction SilentlyContinue }
            Start-Sleep -Seconds 120
          }
